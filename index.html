      height: 100%;

    /* iOS safe area 대응 */
    @supports (padding: max(0px)) {

    @keyframes fadeIn {

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(30px); }

    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-slide-left { animation: slideInLeft 0.25s ease-out; }

    /* 목표 매도환율 도달 깜박임 애니메이션 */
    @keyframes sellTargetReached {
      0%, 100% {

      }
    }
    .sell-target-reached {
      animation: sellTargetReached 1s ease-in-out infinite;
      border: 2px solid #22c55e !important;
      position: relative;
    }
    .sell-target-reached::before {
      content: '💰 매도 타이밍!';
      position: absolute;
      top: -10px;
      right: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);

      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      z-index: 10;

      0%, 100% { 
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fef3c7 100%);
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);

      // Send message to Flutter

        var message = JSON.stringify({ action: action, data: data, timestamp: Date.now() });

        if (window.BudgetChannel && window.BudgetChannel.postMessage) {

          window.FlutterChannel.postMessage(message);
          console.log('[FlutterBridge] Sent via FlutterChannel:', action);
          return true;
        }
        
        // Method 3: flutter_inappwebview
        if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
          window.flutter_inappwebview.callHandler('BudgetChannel', message);
          console.log('[FlutterBridge] Sent via flutter_inappwebview:', action);
          return true;

        // Method 4: FlutterWebView

          window.FlutterWebView.postMessage(message);
          console.log('[FlutterBridge] Sent via FlutterWebView:', action);
          return true;

    // Check and add automatic installment payments
    function checkAutoInstallments() {
      var today = new Date();
      var currentYear = today.getFullYear();
      var currentMonth = today.getMonth();
      
      // 고유한 할부 시리즈 찾기 (startDate + originalAmount 조합으로 그룹화)
      var uniqueInstallments = {};
      state.transactions.filter(function(t) {
        return t.installmentInfo && t.installmentInfo.total > 1 && t.installmentInfo.startDate;
      }).forEach(function(t) {
        var key = t.installmentInfo.startDate + '_' + t.installmentInfo.originalAmount;
        if (!uniqueInstallments[key]) {
          uniqueInstallments[key] = {
            info: t.installmentInfo,
            isNecessary: t.isNecessary,
            existingMonths: []
          };
        }
        // 이미 입력된 회차 기록
        uniqueInstallments[key].existingMonths.push(t.installmentInfo.current);
      });
      
      var totalAdded = 0;
      
      // 각 고유 할부 시리즈에 대해 처리
      Object.keys(uniqueInstallments).forEach(function(key) {
        var data = uniqueInstallments[key];
        var info = data.info;
        var startDate = new Date(info.startDate);
        var startYear = startDate.getFullYear();
        var startMonth = startDate.getMonth();
        var startDay = startDate.getDate();
        var totalInstallments = info.total;
        var monthlyAmount = info.monthlyAmount;
        var originalMemo = info.originalMemo;
        var originalCategory = info.originalCategory;
        
        // 시작월부터 현재월까지 몇 개월 경과했는지 계산
        var monthsPassed = (currentYear - startYear) * 12 + (currentMonth - startMonth);
        
        // 현재 달까지 입력해야 할 회차 (최대 total까지)
        // monthsPassed가 0이면 첫 달, 1이면 2번째 달...
        var shouldHaveInstallments = Math.min(monthsPassed + 1, totalInstallments);
        
        // 1회차부터 shouldHaveInstallments까지 각 회차가 있는지 확인하고 없으면 추가
        for (var i = 1; i <= shouldHaveInstallments; i++) {
          if (data.existingMonths.indexOf(i) === -1) {
            // 해당 회차가 없으면 추가
            var installmentDate = new Date(startYear, startMonth + (i - 1), startDay);
            var dateStr = installmentDate.getFullYear() + '-' + 
                          String(installmentDate.getMonth() + 1).padStart(2, '0') + '-' + 
                          String(installmentDate.getDate()).padStart(2, '0');
            
            var newTransaction = {
              id: Date.now() + Math.random() + i,
              type: 'expense',
              date: dateStr,
              amount: monthlyAmount,
              category: originalCategory,
              memo: originalMemo ? originalMemo + ' (' + i + '/' + totalInstallments + '회차)' : '할부 ' + i + '/' + totalInstallments + '회차',
              paymentMethod: 'card',
              installment: totalInstallments,
              installmentInfo: {
                current: i,
                total: totalInstallments,
                originalAmount: info.originalAmount,
                startDate: info.startDate,
                monthlyAmount: monthlyAmount,
                originalMemo: originalMemo,
                originalCategory: originalCategory
              },
              isNecessary: data.isNecessary
            };
            
            state.transactions.push(newTransaction);
            totalAdded++;
          }
        }
      });
      
      if (totalAdded > 0) {
        saveData();
        showToast(totalAdded + '건의 할부금이 자동 입력되었습니다');
      }
    }

    // Check and add automatic fixed expenses
    function checkAutoFixedExpenses() {
      var today = new Date();
      var currentYear = today.getFullYear();
      var currentMonth = today.getMonth();
      var currentDay = today.getDate();
      var totalAdded = 0;
      
      state.fixedExpenses.forEach(function(fe) {
        if (!fe.active) return;
        
        var startDate = new Date(fe.startDate);
        var endDate = fe.endDate ? new Date(fe.endDate) : new Date('2099-12-31');
        
        // 시작일부터 현재까지 또는 종료일까지의 모든 월 체크
        var checkDate = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        var endCheckDate = new Date(Math.min(today.getTime(), endDate.getTime()));
        
        while (checkDate <= endCheckDate) {
          var checkYear = checkDate.getFullYear();
          var checkMonth = checkDate.getMonth();
          
          // 현재 달이거나 지난 달인 경우에만 처리
          if (checkYear < currentYear || (checkYear === currentYear && checkMonth <= currentMonth)) {
            // 해당 월의 출금일
            var paymentDate = new Date(checkYear, checkMonth, fe.payDay);
            
            // 시작일 이후이고 종료일 이전인 경우에만
            if (paymentDate >= startDate && paymentDate <= endDate) {
              var dateString = paymentDate.toISOString().split('T')[0];
              
              // 이미 입력된 거래가 있는지 확인
              var existingTransaction = state.transactions.find(function(t) {
                return t.fixedExpenseId === fe.id && t.date === dateString;
              });
              
              if (!existingTransaction) {
                // 오늘 이전이거나 오늘이고 출금일이 지났으면 입력
                if (paymentDate < today || (checkYear === currentYear && checkMonth === currentMonth && currentDay >= fe.payDay)) {
                  var newTransaction = {
                    id: Date.now() + Math.random(),
                    type: 'expense',
                    date: dateString,
                    amount: fe.amount,
                    category: fe.category,
                    memo: fe.memo ? fe.memo + ' (고정비)' : '고정비',
                    paymentMethod: fe.paymentMethod,
                    installment: 0,
                    isNecessary: true,
                    fixedExpenseId: fe.id
                  };
                  state.transactions.push(newTransaction);
                  totalAdded++;
                }
              }
            }
          }
          
          // 다음 달로 이동
          checkDate.setMonth(checkDate.getMonth() + 1);
        }
      });
      
      if (totalAdded > 0) {
        saveData();
        showToast(totalAdded + '건의 고정비가 자동 입력되었습니다');
      }
    }

    // Check and add automatic loan repayments
    function checkAutoLoanRepayments() {
      var today = new Date();
      var currentYear = today.getFullYear();
      var currentMonth = today.getMonth();
      var currentDay = today.getDate();
      
      state.loans.forEach(function(loan) {
        if (!loan.monthlyPayment || loan.monthlyPayment <= 0) return;
        if (!loan.payDay) return;
        
        // Check if repayment date has passed
        if (loan.repayDate) {
          var repayEnd = new Date(loan.repayDate);
          if (today > repayEnd) return; // Loan already fully repaid
        }
        
        // Check if loan start date has passed
        if (loan.loanDate) {
          var loanStart = new Date(loan.loanDate);
          if (today < loanStart) return; // Loan hasn't started yet
        }
        
        // Check if today is the payment day or has passed this month
        if (currentDay >= loan.payDay) {
          var repaymentDate = new Date(currentYear, currentMonth, loan.payDay);
          var dateString = repaymentDate.toISOString().split('T')[0];
          
          // Check if transaction already exists for this month
          var existingTransaction = state.transactions.find(function(t) {
            return t.type === 'expense' && 
                   t.category === '대출상환' && 
                   t.date === dateString && 
                   t.memo && t.memo.indexOf(loan.name) >= 0;
          });
          
          if (!existingTransaction) {
            // Add automatic repayment transaction
            var newTransaction = {
              id: Date.now() + Math.random(),
              type: 'expense',
              date: dateString,
              amount: loan.monthlyPayment,
              category: '대출상환',
              memo: loan.name + ' 월상환금 (자동)',
              paymentMethod: 'cash',
              installment: 0,
              isNecessary: true
            };
            state.transactions.push(newTransaction);
            saveData();
            showToast(loan.name + ' 월상환금이 자동 등록되었습니다');
          }
        }
      });
    }

    // Toast notification
    var toastTimeout;
    function showToast(message, type) {
      type = type || 'success';
      var existing = document.getElementById('toast');
      if (existing) existing.remove();
      
      var toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 px-4 py-3 rounded-lg shadow-lg z-50 ' + 
        (type === 'error' ? 'bg-red-500' : 'bg-green-500') + ' text-white font-medium animate-fade-in';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() { toast.remove(); }, 3000);
    }

    function numpadInput(val) {
      if (val === 'C') {
        state.numpadValue = '';
      } else if (val === 'DEL') {
        state.numpadValue = state.numpadValue.slice(0, -1);
      } else if (val === '00' || val === '000') {
        state.numpadValue += val;
      } else {
        state.numpadValue += val;
      }
      updateNumpadDisplay();
    }

    function updateNumpadDisplay() {
      var display = document.getElementById('numpad-display');
      if (display) {
        var value = state.numpadValue;
        if (value === '') {
          display.textContent = '0';
        } else {
          display.textContent = parseInt(value, 10).toLocaleString();
        }
      }
    }

    function submitNumpad() {
      var value = parseInt(state.numpadValue, 10) || 0;
      
      // 대상 input에 값 설정
      if (state.numpadTargetId) {
        var targetInput = document.getElementById(state.numpadTargetId);
        if (targetInput) {
          targetInput.value = value > 0 ? value.toLocaleString() : '';
          // input 이벤트 트리거 (할부 정보 업데이트 등)
          var event = new Event('input', { bubbles: true });
          targetInput.dispatchEvent(event);
        }
      }
      
      // 콜백 실행
      if (state.numpadCallback && typeof state.numpadCallback === 'function') {
        state.numpadCallback(value);
      }
      
      closeNumpad();
    }

    // 계산기 모달

    function openCalculator(targetId, title, initialValue, callback) {
      state.showCalculator = true;
      state.calcTargetId = targetId;
      state.calcTitle = title || '계산기';
      state.calcValue = initialValue ? String(initialValue).replace(/[^\d]/g, '') : '';
      state.calcExpression = state.calcValue;
      state.calcCallback = callback || null;
      renderCalculatorModal();
    }

    function closeCalculator() {
      state.showCalculator = false;
      state.calcTargetId = null;
      state.calcValue = '';
      state.calcExpression = '';
      state.calcCallback = null;
      var modal = document.getElementById('calculator-modal');
      if (modal) modal.remove();
    }

    function calcInput(val) {
      if (val === 'C') {
        state.calcExpression = '';
        state.calcValue = '';
      } else if (val === 'DEL') {
        state.calcExpression = state.calcExpression.slice(0, -1);
      } else if (val === '()') {
        // 괄호 자동 처리
        var openCount = (state.calcExpression.match(/\(/g) || []).length;
        var closeCount = (state.calcExpression.match(/\)/g) || []).length;
        var lastChar = state.calcExpression.slice(-1);
        if (openCount > closeCount && lastChar !== '(' && !isOperator(lastChar)) {
          state.calcExpression += ')';
        } else {
          state.calcExpression += '(';
        }
      } else if (val === '%') {
        state.calcExpression += '%';
      } else if (val === '.') {
        // 소수점 처리
        var parts = state.calcExpression.split(/[\+\-\×\÷]/);
        var lastPart = parts[parts.length - 1];
        if (!lastPart.includes('.')) {
          state.calcExpression += val;
        }
      } else if (isOperator(val)) {
        var lastChar = state.calcExpression.slice(-1);
        if (state.calcExpression !== '' && !isOperator(lastChar) && lastChar !== '(') {
          state.calcExpression += val;
        } else if (isOperator(lastChar)) {
          state.calcExpression = state.calcExpression.slice(0, -1) + val;
        }
      } else {
        state.calcExpression += val;
      }
      updateCalculatorDisplay();
    }

    function isOperator(char) {
      return ['+', '-', '×', '÷'].indexOf(char) !== -1;
    }

    function updateCalculatorDisplay() {
      var display = document.getElementById('calc-display');
      if (display) {
        if (state.calcExpression === '') {
          display.textContent = '0';
        } else {
          display.textContent = formatCalcExpression(state.calcExpression);
        }
      }
    }

    function formatCalcExpression(expr) {
      // 숫자 부분에 천단위 구분자 추가
      return expr.replace(/(\d+)/g, function(match) {
        return parseInt(match, 10).toLocaleString();
      });
    }

    function calculateResult() {
      try {
        var expr = state.calcExpression;
        // 연산자 변환
        expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
        // 퍼센트 처리
        expr = expr.replace(/(\d+)%/g, '($1/100)');
        
        // 계산 (안전한 eval 대안)
        var result = Function('"use strict"; return (' + expr + ')')();
        
        if (isNaN(result) || !isFinite(result)) {
          showToast('계산 오류', 'error');
          return;
        }
        
        state.calcValue = Math.round(result);
        state.calcExpression = String(state.calcValue);
        updateCalculatorDisplay();
      } catch (e) {
        showToast('잘못된 수식입니다', 'error');
      }
    }

    function submitCalculator() {
      // 수식이 있으면 먼저 계산
      if (state.calcExpression && state.calcExpression.match(/[\+\-\×\÷]/)) {
        calculateResult();
      }
      
      var value = parseInt(state.calcExpression.replace(/[^\d\-]/g, ''), 10) || 0;
      value = Math.abs(value); // 절대값 사용
      
      // 대상 input에 값 설정
      if (state.calcTargetId) {
        var targetInput = document.getElementById(state.calcTargetId);
        if (targetInput) {
          targetInput.value = value > 0 ? value.toLocaleString() : '';
          // input 이벤트 트리거
          var event = new Event('input', { bubbles: true });
          targetInput.dispatchEvent(event);
        }
      }
      
      // 콜백 실행
      if (state.calcCallback && typeof state.calcCallback === 'function') {
        state.calcCallback(value);
      }
      
      closeCalculator();
    }

    // Format input with commas
    function formatAmountInput(input) {
      var value = input.value.replace(/[^\d]/g, '');
      if (value === '') {
        input.value = '';
        return;
      }
      var num = parseInt(value, 10);
      input.value = num.toLocaleString();
    }

    function getAmountValue(inputId) {
      var input = document.getElementById(inputId);
      if (!input) return 0;
      var value = input.value.replace(/[^\d]/g, '');
      return parseInt(value, 10) || 0;
    }

    // Format quantity input (allows decimal)
    function formatQuantityInput(input) {
      var value = input.value.replace(/[^\d.]/g, '');
      // Only allow one decimal point
      var parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }
      input.value = value;
    }

    // Get quantity value (allows decimal)
    function getQuantityValue(inputId) {
      var input = document.getElementById(inputId);
      if (!input) return 0;
      var value = input.value.replace(/[^\d.]/g, '');
      return parseFloat(value) || 0;
    }

    function getInvestGrade(totalProfit, totalInvested) {
      if (totalInvested === 0) return { grade: '초보', color: 'text-gray-600', bg: 'bg-gray-100' };
      var rate = (totalProfit / totalInvested) * 100;
      if (rate < 0) return { grade: '손실', color: 'text-gray-700', bg: 'bg-gray-200' };
      if (rate < 10) return { grade: '하수', color: 'text-blue-700', bg: 'bg-blue-100' };
      if (rate < 20) return { grade: '중수', color: 'text-green-700', bg: 'bg-green-100' };
      if (rate < 30) return { grade: '고수', color: 'text-purple-700', bg: 'bg-purple-100' };
      if (rate < 50) return { grade: '실버', color: 'text-slate-700', bg: 'bg-slate-200' };
      if (rate < 60) return { grade: '골드', color: 'text-yellow-700', bg: 'bg-yellow-100' };
      return { grade: '투자의 신', color: 'text-red-700', bg: 'bg-gradient-to-r from-yellow-200 to-red-200' };
    }

    function addToUndoStack(action, data) {
      state.undoStack.push({ action: action, data: data, timestamp: Date.now() });
      if (state.undoStack.length > 10) state.undoStack.shift();
    }

    function handleUndo() {
      if (state.undoStack.length === 0) return;
      var lastAction = state.undoStack.pop();
      
      if (lastAction.action === 'deleteTransaction') {
        state.transactions.push(lastAction.data);
        showToast('거래 삭제를 취소했습니다');
      } else if (lastAction.action === 'deleteMemo') {
        state.memos.push(lastAction.data);
        showToast('메모 삭제를 취소했습니다');
      }
      saveData();
      render();
    }

    // Export/Import functions
    function exportData() {
      var data = {
        transactions: state.transactions,
        memos: state.memos,
        goals: state.goals,
        bankBalances: state.bankBalances,
        investments: state.investments,
        dividends: state.dividends,
        investmentJournals: state.investmentJournals,
        loans: state.loans,
        events: state.events,
        categories: state.categories,
        // 고정비(fixedExpenses) 데이터 포함
        fixedExpenses: state.fixedExpenses,
        exchangeData: {
          usdPhases: state.usdPhases,
          jpyPhases: state.jpyPhases,
          usdRate: state.usdRate,
          jpyRate: state.jpyRate,
          usdNextId: state.usdNextId,
          jpyNextId: state.jpyNextId,
          usdInitialBudget: state.usdInitialBudget,
          jpyInitialBudget: state.jpyInitialBudget
        },
        exportDate: new Date().toISOString(),
        version: '2.1'  // 버전 정보 추가
      };
      
      var filename = 'budget_backup_' + new Date().toISOString().split('T')[0] + '.json';
      var jsonContent = JSON.stringify(data, null, 2);
      
      // Try Flutter WebView first
      if (FlutterBridge.isFlutterWebView()) {
        console.log('[exportData] Flutter WebView detected, sending exportJSON request');
        FlutterBridge.postMessage('exportJSON', { 
          content: jsonContent, 
          filename: filename,
          mimeType: 'application/json'
        });
        showToast('데이터 백업을 요청했습니다');
        return;
      }
      
      // Fallback to browser download
      console.log('[exportData] Browser fallback - creating download link');
      var blob = new Blob([jsonContent], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('데이터가 백업되었습니다');
    }

    function exportToCSV() {
      var headers = ['날짜', '유형', '카테고리', '금액', '결제수단', '할부', '필요지출', '메모'];
      var rows = state.transactions.map(function(t) {
        return [
          t.date,
          t.type === 'income' ? '수입' : '지출',
          t.category,
          t.amount,
          t.paymentMethod === 'card' ? '카드' : '현금',
          t.installment || '일시불',
          t.isNecessary ? '필요' : '불필요',
          t.memo || ''
        ];
      });

      var csvContent = [headers].concat(rows)
        .map(function(row) { return row.map(function(cell) { return '"' + cell + '"'; }).join(','); })
        .join('\n');

      var BOM = '\uFEFF';
      var fullContent = BOM + csvContent;
      var filename = '거래내역_' + new Date().toISOString().split('T')[0] + '.csv';
      
      // Try Flutter WebView first
      if (FlutterBridge.isFlutterWebView()) {
        console.log('[exportToCSV] Flutter WebView detected, sending exportCSV request');
        FlutterBridge.postMessage('exportCSV', { 
          content: fullContent, 
          filename: filename,
          mimeType: 'text/csv'
        });
        showToast('거래내역 내보내기를 요청했습니다');
        return;
      }
      
      // Fallback to browser download
      console.log('[exportToCSV] Browser fallback - creating download link');
      var blob = new Blob([fullContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('CSV 파일이 다운로드되었습니다');
    }

    function importData(event) {
      // If called without event, try Flutter import
      if (!event || !event.target) {
        if (FlutterBridge.requestImport()) {
          showToast('파일 선택을 요청했습니다');
          return;
        }
        // Fallback: trigger file input click
        document.getElementById('importFile').click();
        return;
      }
      
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (!data.transactions || !Array.isArray(data.transactions)) {
            throw new Error('잘못된 데이터 형식');
          }

          if (confirm('현재 데이터를 모두 삭제하고 가져온 데이터로 교체하시겠습니까?')) {
            state.transactions = data.transactions || [];
            state.memos = data.memos || [];
            state.goals = data.goals || { year7: '', year5: '', year3: '', thisYear: '' };
            state.bankBalances = data.bankBalances || [];
            state.investments = data.investments || [];
            state.dividends = data.dividends || [];
            state.investmentJournals = data.investmentJournals || [];
            state.loans = data.loans || [];
            state.events = data.events || [];
            state.fixedExpenses = data.fixedExpenses || [];
            if (data.categories) state.categories = data.categories;
            if (data.exchangeData) {
              state.usdPhases = data.exchangeData.usdPhases || [];
              state.jpyPhases = data.exchangeData.jpyPhases || [];
              state.usdRate = data.exchangeData.usdRate || 1380;
              state.jpyRate = data.exchangeData.jpyRate || 920;
              state.usdNextId = data.exchangeData.usdNextId || 1;
              state.jpyNextId = data.exchangeData.jpyNextId || 1;
              state.usdInitialBudget = data.exchangeData.usdInitialBudget || 10000000;
              state.jpyInitialBudget = data.exchangeData.jpyInitialBudget || 10000000;
            }
            saveData();
            render();
            showToast('데이터를 성공적으로 가져왔습니다');
            FlutterBridge.notifyDataChange('import');
          }
        } catch (error) {
          console.error('Import error:', error);
          showToast('데이터 가져오기에 실패했습니다', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
    
    // Trigger import for Flutter WebView (can be called directly)
    function triggerImport() {
      if (FlutterBridge.isFlutterWebView()) {
        console.log('[triggerImport] Flutter WebView detected, sending requestImport');
        FlutterBridge.postMessage('requestImport', { 
          accept: '.json',
          mimeTypes: ['application/json']
        });
        showToast('파일 선택을 요청했습니다');
      } else {
        console.log('[triggerImport] Browser fallback - clicking file input');
        document.getElementById('importFile').click();
      }
    }

            '<div class="hamburger-btn" onclick="state.showSideMenu=true;render()">' +
              '<span></span>' +
              '<span></span>' +
              '<span></span>' +
            '</div>' +

    // Income Detail Modal (수입 상세 모달 - 개선된 UI)
    function renderIncomeDetailModal() {
      var today = new Date();
      var currentMonth = state.incomeDetailMonth;
      var currentYear = state.incomeDetailYear;
      var monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      
      // 월 이동 함수
      function getMonthNavHtml() {
        return '<div class="flex items-center justify-center gap-3 mt-2">' +
          '<button onclick="var d=new Date(state.incomeDetailYear,state.incomeDetailMonth-1,1);state.incomeDetailMonth=d.getMonth();state.incomeDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-indigo-800 hover:bg-indigo-900 flex items-center justify-center transition text-white font-bold text-lg shadow-md">◀</button>' +
          '<span class="text-lg font-bold text-white min-w-[120px] text-center">' + currentYear + '년 ' + monthNames[currentMonth] + '</span>' +
          '<button onclick="var d=new Date(state.incomeDetailYear,state.incomeDetailMonth+1,1);state.incomeDetailMonth=d.getMonth();state.incomeDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-indigo-800 hover:bg-indigo-900 flex items-center justify-center transition text-white font-bold text-lg shadow-md">▶</button>' +
        '</div>';
      }
      
      // 이번 달 수입 거래만 필터링
      var monthlyIncomeTx = state.transactions.filter(function(t) {
        var d = new Date(t.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'income';
      });
      
      // 카테고리별 합계 계산
      var categoryTotals = {};
      state.categories.income.forEach(function(cat) {
        categoryTotals[cat] = 0;
      });
      
      monthlyIncomeTx.forEach(function(t) {
        if (categoryTotals[t.category] !== undefined) {
          categoryTotals[t.category] += t.amount;
        } else {
          categoryTotals['기타수입'] = (categoryTotals['기타수입'] || 0) + t.amount;
        }
      });
      
      // 총 수입 계산
      var totalIncome = Object.values(categoryTotals).reduce(function(sum, val) { return sum + val; }, 0);
      
      // 카테고리별 색상 및 아이콘 정의
      var categoryStyles = {
        '급여': { color: '#4F46E5', icon: '💰', emoji: '💵' },
        '이자': { color: '#10B981', icon: '🏦', emoji: '🌱' },
        '대리업무': { color: '#EC4899', icon: '💼', emoji: '📋' },
        '배당금': { color: '#3B82F6', icon: '📈', emoji: '💎' },
        '기타수입': { color: '#F59E0B', icon: '📦', emoji: '✨' }
      };
      
      // 데이터가 있는 카테고리만 필터링하고 금액 순으로 정렬
      var sortedCategories = Object.keys(categoryTotals)
        .filter(function(cat) { return categoryTotals[cat] > 0; })
        .sort(function(a, b) { return categoryTotals[b] - categoryTotals[a]; });
      
      // ========== 최근 12개월 수입 데이터 계산 ==========
      var monthlyIncomeData = [];
      for (var i = 11; i >= 0; i--) {
        var targetDate = new Date(currentYear, currentMonth - i, 1);
        var targetMonth = targetDate.getMonth();
        var targetYear = targetDate.getFullYear();
        
        var monthIncome = state.transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear && t.type === 'income';
        }).reduce(function(sum, t) { return sum + t.amount; }, 0);
        
        monthlyIncomeData.push({
          month: targetMonth,
          year: targetYear,
          label: (targetMonth + 1) + '월',

          income: monthIncome,
          isCurrent: i === 0
        });

      // 가장 많은/적은 수입 달 찾기
      var nonZeroMonths = monthlyIncomeData.filter(function(m) { return m.income > 0; });

      var minIncomeMonth = nonZeroMonths.length > 0 ? nonZeroMonths.reduce(function(min, m) { return m.income < min.income ? m : min; }) : null;

      // ========== 월별 비교 카드 HTML ==========

            '<div class="text-xs mt-2 ' + (diffFromMin >= 0 ? 'text-emerald-600' : 'text-red-500') + '">' +

        '</div>';
      } else {

      // ========== 12개월 막대 그래프 HTML (이미지 스타일 개선) ==========

      var incomeYAxisMax = Math.ceil(maxIncome / 500000) * 500000;

      var barChartHtml = '<div class="bg-gradient-to-b from-gray-50 to-white rounded-2xl p-5 shadow-lg border border-gray-200" style="position: relative;">' +

        '<div style="display: flex; height: 220px; position: relative;">' +
          // Y축 레이블
          '<div style="width: 60px; display: flex; flex-direction: column-reverse; justify-content: space-between; padding-right: 8px; font-size: 11px; color: #6b7280;">' +

              return '<span style="text-align: right;">' + (val >= 10000 ? Math.round(val / 10000) + '만 원' : val + '원') + '</span>';
            }).join('') +
          '</div>' +
          // 차트 영역
          '<div style="flex: 1; position: relative; border-left: 2px solid #e5e7eb;">' +
            // 수평 그리드 라인

    // Expense Detail Modal (지출 상세 모달)
    function renderExpenseDetailModal() {

      var currentYear = state.expenseDetailYear;

      function getMonthNavHtml() {
        return '<div class="flex items-center justify-center gap-3 mt-2">' +
          '<button onclick="var d=new Date(state.expenseDetailYear,state.expenseDetailMonth-1,1);state.expenseDetailMonth=d.getMonth();state.expenseDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-red-800 hover:bg-red-900 flex items-center justify-center transition text-white font-bold text-lg shadow-md">◀</button>' +
          '<span class="text-lg font-bold text-white min-w-[120px] text-center">' + currentYear + '년 ' + monthNames[currentMonth] + '</span>' +
          '<button onclick="var d=new Date(state.expenseDetailYear,state.expenseDetailMonth+1,1);state.expenseDetailMonth=d.getMonth();state.expenseDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-red-800 hover:bg-red-900 flex items-center justify-center transition text-white font-bold text-lg shadow-md">▶</button>' +
        '</div>';
      }
      
      // 이번 달 지출 거래만 필터링
      var monthlyExpenseTx = state.transactions.filter(function(t) {
        var d = new Date(t.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'expense';
      });
      
      // 카테고리별 합계 계산
      var categoryTotals = {};
      state.categories.expense.forEach(function(cat) {
        categoryTotals[cat] = 0;
      });
      
      monthlyExpenseTx.forEach(function(t) {
        if (categoryTotals[t.category] !== undefined) {
          categoryTotals[t.category] += t.amount;

          categoryTotals['기타비'] = (categoryTotals['기타비'] || 0) + t.amount;

      // 총 지출 계산
      var totalExpense = Object.values(categoryTotals).reduce(function(sum, val) { return sum + val; }, 0);
      
      // 카테고리별 색상 및 아이콘 정의

        '생활용품': { color: '#06B6D4', emoji: '🧴' },
        '의료비': { color: '#EC4899', emoji: '💊' },
        '교육비': { color: '#3B82F6', emoji: '📚' },
        '문화생활': { color: '#10B981', emoji: '🎬' },
        '아버지': { color: '#6366F1', emoji: '👨‍🦳' },
        '지환': { color: '#14B8A6', emoji: '👦' },
        '다혜': { color: '#F472B6', emoji: '👧' },
        '다연': { color: '#A855F7', emoji: '👶' },
        '보험료': { color: '#64748B', emoji: '🛡️' },
        '외식비': { color: '#FB923C', emoji: '🍽️' },
        '세금공과금': { color: '#475569', emoji: '📋' },
        '주유비': { color: '#84CC16', emoji: '⛽' },
        '대출상환': { color: '#DC2626', emoji: '🏦' },
        '기타비': { color: '#9CA3AF', emoji: '📦' }
      };
      
      // 데이터가 있는 카테고리만 필터링하고 금액 순으로 정렬
      var sortedCategories = Object.keys(categoryTotals)
        .filter(function(cat) { return categoryTotals[cat] > 0; })
        .sort(function(a, b) { return categoryTotals[b] - categoryTotals[a]; });
      
      // ========== 최근 12개월 지출 데이터 계산 ==========
      var monthlyExpenseData = [];

        });

      // 가장 많은/적은 지출 달 찾기

      var minExpenseMonth = nonZeroMonths.length > 0 ? nonZeroMonths.reduce(function(min, m) { return m.expense < min.expense ? m : min; }) : null;

      var maxExpense = Math.max.apply(null, monthlyExpenseData.map(function(m) { return m.expense; }));

        yearCategoryTotals[cat] = 0;

          '</div>' +

          '</div>' +
          // 최저 지출 달
          '<div class="bg-gradient-to-br from-emerald-50 to-green-50 rounded-xl p-4 border border-emerald-200">' +

          '</div>' +

      // ========== 12개월 막대 그래프 HTML (이미지 스타일 개선) ==========

      var expenseYAxisMax = Math.ceil(maxExpense / 500000) * 500000;
      if (expenseYAxisMax === 0) expenseYAxisMax = 1000000;
      var expenseYAxisSteps = [0, expenseYAxisMax * 0.25, expenseYAxisMax * 0.5, expenseYAxisMax * 0.75, expenseYAxisMax];
      
      var barChartHtml = '<div class="bg-gradient-to-b from-gray-50 to-white rounded-2xl p-5 shadow-lg border border-gray-200" style="position: relative;">' +

            // 막대 그래프들

        var gradientStyle = isCurrentMonth 
          ? 'background: linear-gradient(to top, #DC2626, #F87171);'

        barChartHtml += '<div style="flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 28px; height: 100%;">' +

            // 금액 레이블 (막대 위에 세로로)

              formatNumber(m.expense) + '원' +

            '<div style="width: 100%; border-radius: 4px 4px 0 0; ' + gradientStyle + ' height: ' + barHeight + '%; min-height: 3px; transition: all 0.3s ease; box-shadow: ' + (isCurrentMonth ? '0 4px 12px rgba(220, 38, 38, 0.4)' : '0 2px 6px rgba(96, 165, 250, 0.3)') + ';"></div>' +

          // 월 레이블

        '</div>';
      });
      
      barChartHtml += '</div></div></div>' +
        // 범례
        '<div style="display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 11px;">' +
          '<div style="display: flex; align-items: center; gap: 6px;">' +
            '<div style="width: 12px; height: 12px; border-radius: 2px; background: linear-gradient(to top, #DC2626, #F87171);"></div>' +

            '<span style="color: #6b7280;">지난 달</span>' +
          '</div>' +
        '</div>' +
      '</div>';
      
      // ========== 12개월 카테고리별 지출 HTML ==========

        yearCategoryHtml = '<div class="space-y-3">';
        sortedYearCategories.forEach(function(cat) {
          var amount = yearCategoryTotals[cat];
          var percentage = yearTotalExpense > 0 ? ((amount / yearTotalExpense) * 100).toFixed(1) : 0;
          var style = categoryStyles[cat] || { color: '#9CA3AF', emoji: '📌' };
          var barWidth = yearTotalExpense > 0 ? (amount / yearTotalExpense) * 100 : 0;

    // Monthly Balance Modal (월별 잔액 현황 모달)
    function renderMonthlyBalanceModal() {
      var today = new Date();
      var monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      
      // 최근 12개월 데이터 계산
      var monthlyData = [];
      var totalBalance = 0;
      
      for (var i = 11; i >= 0; i--) {
        var targetDate = new Date(today.getFullYear(), today.getMonth() - i, 1);
        var year = targetDate.getFullYear();
        var month = targetDate.getMonth();
        
        // 해당 월의 수입 계산
        var monthIncome = state.transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === month && d.getFullYear() === year && t.type === 'income';
        }).reduce(function(sum, t) { return sum + t.amount; }, 0);
        
        // 해당 월의 지출 계산
        var monthExpense = state.transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === month && d.getFullYear() === year && t.type === 'expense';
        }).reduce(function(sum, t) { return sum + t.amount; }, 0);
        
        var balance = monthIncome - monthExpense;
        totalBalance += balance;
        
        monthlyData.push({
          year: year,
          month: month,
          label: year + '년 ' + monthNames[month],
          shortLabel: (month + 1) + '월',
          income: monthIncome,
          expense: monthExpense,
          balance: balance
        });
      }
      
      // 최대값 계산 (그래프 스케일용)
      var maxBalance = Math.max.apply(null, monthlyData.map(function(d) { return Math.abs(d.balance); }));
      if (maxBalance === 0) maxBalance = 1;
      
      // 월별 리스트 HTML
      var monthListHtml = monthlyData.slice().reverse().map(function(d, idx) {
        var isPositive = d.balance >= 0;
        var bgColor = isPositive ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';
        var textColor = isPositive ? 'text-green-700' : 'text-red-700';
        var sign = isPositive ? '+' : '';
        
        return '<div class="' + bgColor + ' border rounded-lg p-3 flex justify-between items-center">' +
          '<div>' +
            '<div class="font-medium text-gray-800">' + d.label + '</div>' +
            '<div class="text-xs text-gray-500">수입: ' + formatNumber(d.income) + '원 / 지출: ' + formatNumber(d.expense) + '원</div>' +
          '</div>' +
          '<div class="text-right">' +
            '<div class="font-bold ' + textColor + '">' + sign + formatNumber(d.balance) + '원</div>' +
          '</div>' +
        '</div>';
      }).join('');
      
      // 막대 그래프 HTML
      var barChartHtml = '<div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">' +
        '<div class="flex items-end justify-between gap-1" style="height: 160px;">';
      
      monthlyData.forEach(function(d) {
        var isPositive = d.balance >= 0;
        var heightPercent = Math.abs(d.balance) / maxBalance * 100;
        var minHeight = d.balance !== 0 ? 8 : 2;
        var barColor = isPositive ? 'bg-green-500' : 'bg-red-500';
        
        barChartHtml += '<div class="flex-1 flex flex-col items-center justify-end h-full">' +
          '<div class="w-full max-w-[24px] ' + barColor + ' rounded-t transition-all hover:opacity-80" style="height: ' + Math.max(heightPercent, minHeight) + '%;"></div>' +
          '<div class="text-xs text-gray-500 mt-1 text-center">' + d.shortLabel + '</div>' +
        '</div>';
      });
      
      barChartHtml += '</div>' +
        '<div class="flex justify-between mt-3 text-xs text-gray-400">' +
          '<span>← 과거</span>' +
          '<span>현재 →</span>' +
        '</div>' +
      '</div>';
      
      // 총합 계산
      var totalIsPositive = totalBalance >= 0;
      var totalSign = totalIsPositive ? '+' : '';
      var totalTextColor = totalIsPositive ? 'text-green-700' : 'text-red-700';
      var totalBgColor = totalIsPositive ? 'bg-green-100 border-green-300' : 'bg-red-100 border-red-300';
      
      return '<div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50" onclick="if(event.target===this){state.showMonthlyBalance=false;render();}">' +
        '<div class="bg-gray-50 rounded-2xl w-full max-w-md max-h-[90vh] overflow-hidden shadow-2xl flex flex-col" style="margin: auto;">' +
          
          // 헤더
          '<div class="bg-gradient-to-r from-amber-500 to-yellow-500 p-4 text-white flex-shrink-0 relative">' +
            '<button onclick="state.showMonthlyBalance=false;render()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white text-gray-700 hover:bg-gray-100 flex items-center justify-center transition shadow-md" style="font-size: 18px; font-weight: bold; line-height: 1;">✕</button>' +
            '<div class="pr-10">' +
              '<h2 class="text-xl font-bold flex items-center gap-2" style="color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">📊 월별 잔액 현황</h2>' +
              '<div class="text-sm opacity-90 mt-1">최근 12개월 수입-지출 잔액</div>' +
            '</div>' +
            // 총합 표시
            '<div class="mt-3 ' + totalBgColor + ' rounded-xl p-3 shadow-sm border">' +
              '<div class="text-amber-800 text-xs font-medium">12개월 누적 잔액 합계</div>' +
              '<div class="text-2xl font-bold ' + totalTextColor + '">' + totalSign + formatNumber(totalBalance) + '<span class="text-sm ml-1">원</span></div>' +
            '</div>' +
          '</div>' +
          
          // 스크롤 가능한 콘텐츠 영역
          '<div class="flex-1 overflow-y-auto p-4 space-y-4">' +
            
            // 섹션 1: 막대 그래프
            '<div>' +
              '<h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">📈 월별 잔액 추이</h3>' +
              barChartHtml +
              '<div class="flex justify-center gap-4 mt-2 text-xs">' +
                '<span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 rounded"></span> 흑자</span>' +
                '<span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-500 rounded"></span> 적자</span>' +
              '</div>' +
            '</div>' +
            
            // 섹션 2: 월별 상세 리스트
            '<div>' +
              '<h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">📋 월별 상세 내역</h3>' +
              '<div class="space-y-2">' +
                monthListHtml +
              '</div>' +
            '</div>' +
            
          '</div>' +
          
        '</div>' +
      '</div>';
    }
    
    // Unnecessary Expense Detail Modal (불필요 지출 분석 모달)
    function renderUnnecessaryDetailModal() {
      var today = new Date();
      var currentMonth = state.unnecessaryDetailMonth;
      var currentYear = state.unnecessaryDetailYear;
      var monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      
      // 월 이동 함수
      function getMonthNavHtml() {
        return '<div class="flex items-center justify-center gap-3 mt-2">' +
          '<button onclick="var d=new Date(state.unnecessaryDetailYear,state.unnecessaryDetailMonth-1,1);state.unnecessaryDetailMonth=d.getMonth();state.unnecessaryDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-800 flex items-center justify-center transition text-white font-bold text-lg shadow-md">◀</button>' +
          '<span class="text-lg font-bold text-white min-w-[120px] text-center">' + currentYear + '년 ' + monthNames[currentMonth] + '</span>' +
          '<button onclick="var d=new Date(state.unnecessaryDetailYear,state.unnecessaryDetailMonth+1,1);state.unnecessaryDetailMonth=d.getMonth();state.unnecessaryDetailYear=d.getFullYear();render();" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-800 flex items-center justify-center transition text-white font-bold text-lg shadow-md">▶</button>' +
        '</div>';
      }
      
      // 이번 달 불필요 지출 거래만 필터링
      var monthlyUnnecessaryTx = state.transactions.filter(function(t) {
        var d = new Date(t.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'expense' && !t.isNecessary;
      });
      
      // 이번 달 전체 지출
      var monthlyTotalExpense = state.transactions.filter(function(t) {
        var d = new Date(t.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'expense';
      }).reduce(function(sum, t) { return sum + t.amount; }, 0);
      
      // 카테고리별 불필요 지출 합계 계산
      var categoryTotals = {};
      monthlyUnnecessaryTx.forEach(function(t) {
        if (!categoryTotals[t.category]) {
          categoryTotals[t.category] = 0;
        }
        categoryTotals[t.category] += t.amount;
      });
      
      // 총 불필요 지출 계산
      var totalUnnecessary = Object.values(categoryTotals).reduce(function(sum, val) { return sum + val; }, 0);
      
      // 불필요 지출 비율
      var unnecessaryRatio = monthlyTotalExpense > 0 ? (totalUnnecessary / monthlyTotalExpense * 100) : 0;
      
      // 카테고리별 색상 및 아이콘 정의
      var categoryStyles = {
        '식비': { color: '#EF4444', emoji: '🍚' },
        '교통비': { color: '#F97316', emoji: '🚗' },
        '통신비': { color: '#8B5CF6', emoji: '📱' },
        '생활용품': { color: '#06B6D4', emoji: '🧴' },
        '의료비': { color: '#EC4899', emoji: '💊' },
        '교육비': { color: '#3B82F6', emoji: '📚' },
        '문화생활': { color: '#10B981', emoji: '🎬' },
        '아버지': { color: '#6366F1', emoji: '👨‍🦳' },
        '지환': { color: '#14B8A6', emoji: '👦' },
        '다혜': { color: '#F472B6', emoji: '👧' },
        '다연': { color: '#A855F7', emoji: '👶' },
        '보험료': { color: '#64748B', emoji: '🛡️' },
        '외식비': { color: '#FB923C', emoji: '🍽️' },
        '세금공과금': { color: '#475569', emoji: '📋' },
        '주유비': { color: '#84CC16', emoji: '⛽' },
        '대출상환': { color: '#DC2626', emoji: '🏦' },
        '기타비': { color: '#9CA3AF', emoji: '📦' }
      };
      
      // 데이터가 있는 카테고리만 필터링하고 금액 순으로 정렬
      var sortedCategories = Object.keys(categoryTotals)
        .filter(function(cat) { return categoryTotals[cat] > 0; })
        .sort(function(a, b) { return categoryTotals[b] - categoryTotals[a]; });
      
      // ========== 최근 12개월 불필요 지출 데이터 계산 ==========
      var monthlyUnnecessaryData = [];
      for (var i = 11; i >= 0; i--) {
        var targetDate = new Date(currentYear, currentMonth - i, 1);
        var targetMonth = targetDate.getMonth();
        var targetYear = targetDate.getFullYear();
        
        var monthUnnecessary = state.transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear && t.type === 'expense' && !t.isNecessary;
        }).reduce(function(sum, t) { return sum + t.amount; }, 0);
        
        var monthTotal = state.transactions.filter(function(t) {
          var d = new Date(t.date);
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear && t.type === 'expense';
        }).reduce(function(sum, t) { return sum + t.amount; }, 0);
        
        monthlyUnnecessaryData.push({
          month: targetMonth,
          year: targetYear,
          label: (targetMonth + 1) + '월',
          shortLabel: (targetMonth + 1) + '',
          unnecessary: monthUnnecessary,
          total: monthTotal,
          ratio: monthTotal > 0 ? (monthUnnecessary / monthTotal * 100) : 0,
          isCurrent: i === 0
        });
      }
      
      // 가장 많은/적은 불필요 지출 달 찾기
      var nonZeroMonths = monthlyUnnecessaryData.filter(function(m) { return m.unnecessary > 0; });
      var maxUnnecessaryMonth = nonZeroMonths.length > 0 ? nonZeroMonths.reduce(function(max, m) { return m.unnecessary > max.unnecessary ? m : max; }) : null;
      var minUnnecessaryMonth = nonZeroMonths.length > 0 ? nonZeroMonths.reduce(function(min, m) { return m.unnecessary < min.unnecessary ? m : min; }) : null;
      var currentMonthData = monthlyUnnecessaryData[11];
      
      // 최대값 계산 (막대그래프용)
      var maxUnnecessary = Math.max.apply(null, monthlyUnnecessaryData.map(function(m) { return m.unnecessary; }));
      if (maxUnnecessary === 0) maxUnnecessary = 1;
      
      // ========== 메모 분석 ==========
      var memoAnalysis = {};
      monthlyUnnecessaryTx.forEach(function(t) {
        if (t.memo && t.memo.trim()) {
          var memo = t.memo.trim();
          if (!memoAnalysis[memo]) {
            memoAnalysis[memo] = { count: 0, totalAmount: 0, category: t.category };
          }
          memoAnalysis[memo].count++;
          memoAnalysis[memo].totalAmount += t.amount;
        }
      });
      
      // 메모별로 정렬 (금액 순)
      var sortedMemos = Object.keys(memoAnalysis)
        .map(function(memo) {
          return {
            memo: memo,
            count: memoAnalysis[memo].count,
            totalAmount: memoAnalysis[memo].totalAmount,
            category: memoAnalysis[memo].category
          };
        })
        .sort(function(a, b) { return b.totalAmount - a.totalAmount; });
      
      // ========== 이번 달 카테고리 리스트 HTML ==========
      var categoryListHtml = sortedCategories.length > 0 ? sortedCategories.map(function(cat) {
        var amount = categoryTotals[cat];
        var percentage = totalUnnecessary > 0 ? ((amount / totalUnnecessary) * 100).toFixed(1) : 0;
        var style = categoryStyles[cat] || { color: '#9CA3AF', emoji: '📌' };
        var barWidth = totalUnnecessary > 0 ? (amount / totalUnnecessary) * 100 : 0;
        
        return '<div class="bg-white rounded-lg p-3 shadow-sm border border-gray-100">' +
          '<div class="flex items-center justify-between mb-1.5">' +
            '<div class="flex items-center gap-2">' +
              '<div class="w-8 h-8 rounded-lg flex items-center justify-center text-base" style="background-color: ' + style.color + '20;">' + style.emoji + '</div>' +
              '<div>' +
                '<div class="font-semibold text-gray-800 text-sm">' + cat + '</div>' +
                '<div class="text-xs text-gray-500">' + percentage + '%</div>' +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="font-bold text-base text-gray-900">' + formatNumber(amount) + '<span class="text-xs text-gray-400 ml-0.5">원</span></div>' +
            '</div>' +
          '</div>' +
          '<div class="w-full bg-gray-100 rounded-full h-1.5">' +
            '<div class="h-1.5 rounded-full transition-all" style="width: ' + barWidth + '%; background-color: ' + style.color + ';"></div>' +
          '</div>' +
        '</div>';
      }).join('') : '<div class="text-center text-gray-400 py-8 bg-white rounded-xl">이번 달 불필요 지출 내역이 없습니다</div>';
      
      // ========== 월별 비교 카드 HTML ==========
      var comparisonHtml = '';
      if (maxUnnecessaryMonth && minUnnecessaryMonth) {
        var diffFromMax = currentMonthData.unnecessary - maxUnnecessaryMonth.unnecessary;
        var diffFromMin = currentMonthData.unnecessary - minUnnecessaryMonth.unnecessary;
        var diffMaxPercent = maxUnnecessaryMonth.unnecessary > 0 ? ((diffFromMax / maxUnnecessaryMonth.unnecessary) * 100).toFixed(1) : 0;
        var diffMinPercent = minUnnecessaryMonth.unnecessary > 0 ? ((diffFromMin / minUnnecessaryMonth.unnecessary) * 100).toFixed(1) : 0;
        
        comparisonHtml = '<div class="grid grid-cols-2 gap-3">' +
          // 최고 불필요 지출 달
          '<div class="bg-gradient-to-br from-rose-50 to-red-50 rounded-xl p-4 border border-rose-200">' +
            '<div class="flex items-center gap-2 mb-2">' +
              '<span class="text-2xl">🔥</span>' +
              '<span class="text-sm font-bold text-rose-700">최다 지출</span>' +
            '</div>' +
            '<div class="text-xs text-gray-500 mb-1">' + maxUnnecessaryMonth.year + '년 ' + monthNames[maxUnnecessaryMonth.month] + '</div>' +
            '<div class="font-bold text-lg text-rose-800">' + formatNumber(maxUnnecessaryMonth.unnecessary) + '원</div>' +
            '<div class="text-xs mt-2 ' + (diffFromMax <= 0 ? 'text-emerald-600' : 'text-red-500') + '">' +
              '현재 대비 ' + (diffFromMax >= 0 ? '+' : '') + formatNumber(diffFromMax) + '원' +
            '</div>' +
          '</div>' +
          // 최저 불필요 지출 달
          '<div class="bg-gradient-to-br from-emerald-50 to-green-50 rounded-xl p-4 border border-emerald-200">' +
            '<div class="flex items-center gap-2 mb-2">' +
              '<span class="text-2xl">💚</span>' +
              '<span class="text-sm font-bold text-emerald-700">최소 지출</span>' +
            '</div>' +
            '<div class="text-xs text-gray-500 mb-1">' + minUnnecessaryMonth.year + '년 ' + monthNames[minUnnecessaryMonth.month] + '</div>' +
            '<div class="font-bold text-lg text-emerald-800">' + formatNumber(minUnnecessaryMonth.unnecessary) + '원</div>' +
            '<div class="text-xs mt-2 ' + (diffFromMin <= 0 ? 'text-emerald-600' : 'text-red-500') + '">' +
              '현재 대비 ' + (diffFromMin >= 0 ? '+' : '') + formatNumber(diffFromMin) + '원' +
            '</div>' +
          '</div>' +
        '</div>';
      } else {
        comparisonHtml = '<div class="text-center text-gray-400 py-4 bg-gray-50 rounded-xl">비교할 불필요 지출 데이터가 없습니다</div>';
      }
      
      // ========== 12개월 막대 그래프 HTML ==========
      var yAxisMax = Math.ceil(maxUnnecessary / 500000) * 500000;
      if (yAxisMax === 0) yAxisMax = 1000000;

      var barChartHtml = '<div class="bg-gradient-to-b from-gray-50 to-white rounded-2xl p-5 shadow-lg border border-gray-200" style="position: relative;">' +
        '<div class="text-center mb-4">' +
          '<span class="text-lg font-bold text-gray-800">월별 불필요 지출 현황</span>' +
        '</div>' +
        '<div style="display: flex; height: 220px; position: relative;">' +
          '<div style="width: 60px; display: flex; flex-direction: column-reverse; justify-content: space-between; padding-right: 8px; font-size: 11px; color: #6b7280;">' +
            yAxisSteps.map(function(val) {
              return '<span style="text-align: right;">' + (val >= 10000 ? Math.round(val / 10000) + '만 원' : val + '원') + '</span>';
            }).join('') +
          '</div>' +
          '<div style="flex: 1; position: relative; border-left: 2px solid #e5e7eb;">' +
            '<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;">' +
              [0,1,2,3,4].map(function() { return '<div style="border-bottom: 1px dashed #e5e7eb; height: 0;"></div>'; }).join('') +
            '</div>' +
            '<div style="display: flex; align-items: flex-end; justify-content: space-around; height: 100%; padding: 0 4px; position: relative; z-index: 1;">';
      
      monthlyUnnecessaryData.forEach(function(m) {
        var barHeight = yAxisMax > 0 ? Math.max((m.unnecessary / yAxisMax) * 100, 1) : 1;
        var isCurrentMonth = m.isCurrent;
        var gradientStyle = isCurrentMonth 
          ? 'background: linear-gradient(to top, #475569, #94A3B8);' 
          : (m.unnecessary > 0 ? 'background: linear-gradient(to top, #9CA3AF, #D1D5DB);' : 'background: #E5E7EB;');
        
        barChartHtml += '<div style="flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 28px; height: 100%;">' +
          '<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; width: 100%; position: relative;">' +
            '<div style="position: absolute; bottom: ' + barHeight + '%; left: 50%; transform: translateX(-50%) rotate(-90deg); transform-origin: center bottom; white-space: nowrap; font-size: 9px; font-weight: 600; color: ' + (isCurrentMonth ? '#475569' : '#6B7280') + '; margin-bottom: 4px; ' + (m.unnecessary > 0 ? '' : 'display: none;') + '">' +
              formatNumber(m.unnecessary) + '원' +
            '</div>' +
            '<div style="width: 100%; border-radius: 4px 4px 0 0; ' + gradientStyle + ' height: ' + barHeight + '%; min-height: 3px; transition: all 0.3s ease; box-shadow: ' + (isCurrentMonth ? '0 4px 12px rgba(71, 85, 105, 0.4)' : '0 2px 6px rgba(156, 163, 175, 0.3)') + ';"></div>' +
          '</div>' +
          '<div style="margin-top: 8px; font-size: 11px; font-weight: ' + (isCurrentMonth ? '700' : '500') + '; color: ' + (isCurrentMonth ? '#475569' : '#6b7280') + ';">' + m.shortLabel + '월</div>' +
        '</div>';
      });
      
      barChartHtml += '</div></div></div>' +
        '<div style="display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 11px;">' +
          '<div style="display: flex; align-items: center; gap: 6px;">' +
            '<div style="width: 12px; height: 12px; border-radius: 2px; background: linear-gradient(to top, #475569, #94A3B8);"></div>' +
            '<span style="color: #475569; font-weight: 600;">이번 달</span>' +

    var historyPeriod = 'daily';

    var calendarYear = new Date().getFullYear();
    var calendarMonth = new Date().getMonth();

    function setHistoryPeriod(period) {
      historyPeriod = period;
      document.querySelectorAll('.period-btn').forEach(function(btn) {
        if (btn.dataset.period === period) {
          btn.className = 'period-btn px-4 py-2 rounded-lg whitespace-nowrap transition bg-blue-500 text-white shadow-md';
        } else {
          btn.className = 'period-btn px-4 py-2 rounded-lg whitespace-nowrap transition bg-gray-200';
        }
      });
      
      var calendarContainer = document.getElementById('calendar-container');
      var historyList = document.getElementById('history-list');
      
      if (period === 'calendar') {
        if (calendarContainer) calendarContainer.classList.remove('hidden');
        if (historyList) historyList.classList.add('hidden');
        renderCalendar();
      } else {
        if (calendarContainer) calendarContainer.classList.add('hidden');
        if (historyList) historyList.classList.remove('hidden');
        updateHistoryList();
      }
    }

    function renderCalendar() {
      var container = document.getElementById('calendar-container');
      if (!container) return;

      var year = calendarYear;
      var month = calendarMonth;
      var monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      var dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      var firstDay = new Date(year, month, 1);
      var lastDay = new Date(year, month + 1, 0);
      var startDay = firstDay.getDay();
      var totalDays = lastDay.getDate();

      // Get transactions for this month
      var monthTransactions = {};
      state.transactions.forEach(function(t) {
        var tDate = new Date(t.date);
        if (tDate.getFullYear() === year && tDate.getMonth() === month) {
          var day = tDate.getDate();
          if (!monthTransactions[day]) {
            monthTransactions[day] = { income: 0, expense: 0, transactions: [] };
          }
          if (t.type === 'income') {
            monthTransactions[day].income += t.amount;
          } else {
            monthTransactions[day].expense += t.amount;
          }
          monthTransactions[day].transactions.push(t);
        }
      });

      // Calculate monthly totals
      var monthlyIncome = 0;
      var monthlyExpense = 0;
      Object.values(monthTransactions).forEach(function(day) {
        monthlyIncome += day.income;
        monthlyExpense += day.expense;
      });

      var html = '<div class="bg-white rounded-xl shadow-lg p-4 mb-4">' +
        '<div class="flex justify-between items-center mb-4">' +
          '<button onclick="changeCalendarMonth(-1)" class="p-2 hover:bg-gray-100 rounded-lg text-xl font-bold text-gray-600">◀</button>' +
          '<div class="text-center">' +
            '<h3 class="text-xl font-bold text-gray-800">' + year + '년 ' + monthNames[month] + '</h3>' +
            '<div class="flex gap-4 justify-center mt-1 text-sm">' +
              '<span class="text-green-600 font-medium">수입: ' + formatNumber(monthlyIncome) + '원</span>' +
              '<span class="text-red-600 font-medium">지출: ' + formatNumber(monthlyExpense) + '원</span>' +
            '</div>' +
          '</div>' +
          '<button onclick="changeCalendarMonth(1)" class="p-2 hover:bg-gray-100 rounded-lg text-xl font-bold text-gray-600">▶</button>' +
        '</div>' +
        '<div class="grid grid-cols-7 gap-1 mb-2">';

      // Day headers
      dayNames.forEach(function(day, idx) {
        var color = idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-500' : 'text-gray-700';
        html += '<div class="text-center text-sm font-bold ' + color + ' py-2">' + day + '</div>';
      });

      html += '</div><div class="grid grid-cols-7 gap-1">';

      // Empty cells before first day
      for (var i = 0; i < startDay; i++) {
        html += '<div class="h-20 bg-gray-50 rounded-lg"></div>';
      }

      // Day cells
      var today = new Date();
      for (var day = 1; day <= totalDays; day++) {
        var isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        var dayOfWeek = (startDay + day - 1) % 7;
        var isSunday = dayOfWeek === 0;
        var isSaturday = dayOfWeek === 6;
        var dayData = monthTransactions[day];

        var cellBg = isToday ? 'bg-blue-100 border-2 border-blue-500' : 'bg-gray-50 hover:bg-gray-100';
        var dayColor = isSunday ? 'text-red-500' : isSaturday ? 'text-blue-500' : 'text-gray-700';

        html += '<div onclick="showDayTransactions(' + year + ',' + month + ',' + day + ')" class="h-20 ' + cellBg + ' rounded-lg p-1 cursor-pointer transition relative overflow-hidden">' +
          '<div class="text-xs font-bold ' + dayColor + '">' + day + '</div>';

        if (dayData) {
          if (dayData.income > 0) {
            html += '<div class="text-xs text-green-600 font-medium truncate">+' + (dayData.income >= 10000 ? Math.floor(dayData.income / 10000) + '만' : formatNumber(dayData.income)) + '</div>';
          }
          if (dayData.expense > 0) {
            html += '<div class="text-xs text-red-600 font-medium truncate">-' + (dayData.expense >= 10000 ? Math.floor(dayData.expense / 10000) + '만' : formatNumber(dayData.expense)) + '</div>';
          }
          if (dayData.transactions.length > 2) {
            html += '<div class="text-xs text-gray-400">+' + (dayData.transactions.length - 2) + '건</div>';
          }
        }

        html += '</div>';
      }

      // Empty cells after last day
      var remainingCells = 7 - ((startDay + totalDays) % 7);
      if (remainingCells < 7) {
        for (var i = 0; i < remainingCells; i++) {
          html += '<div class="h-20 bg-gray-50 rounded-lg"></div>';
        }
      }

      html += '</div></div>' +
        '<div id="day-transactions-popup" class="hidden"></div>';

      container.innerHTML = html;
    }

    function changeCalendarMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      } else if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      }
      renderCalendar();
    }

    function showDayTransactions(year, month, day) {
      var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var dayTransactions = state.transactions.filter(function(t) {
        return t.date === dateStr;
      });

      if (dayTransactions.length === 0) {
        var popup = document.getElementById('day-transactions-popup');
        if (popup) {
          popup.innerHTML = '<div class="bg-white rounded-xl shadow-lg p-4 mt-4 border-2 border-blue-200">' +
            '<div class="flex justify-between items-center mb-3">' +
              '<h4 class="font-bold text-gray-800">📅 ' + dateStr + '</h4>' +
              '<button onclick="closeDayPopup()" class="text-gray-500 text-xl">✕</button>' +
            '</div>' +
            '<div class="text-center text-gray-400 py-4">거래 내역이 없습니다</div>' +
            '<button onclick="openAddTransactionWithDate(\'' + dateStr + '\')" class="w-full bg-blue-500 text-white py-2 rounded-lg font-medium mt-2">+ 거래 추가</button>' +
          '</div>';
          popup.classList.remove('hidden');
        }
        return;
      }

      var income = dayTransactions.filter(function(t) { return t.type === 'income'; }).reduce(function(s, t) { return s + t.amount; }, 0);
      var expense = dayTransactions.filter(function(t) { return t.type === 'expense'; }).reduce(function(s, t) { return s + t.amount; }, 0);

      var txHtml = dayTransactions.map(function(t) {
        return '<div class="flex justify-between items-center py-2 border-b last:border-b-0 cursor-pointer hover:bg-gray-50 rounded-lg transition-all px-2 -mx-2" onclick="closeDayPopup();showTransactionDetail(' + t.id + ')">' +
          '<div>' +
            '<div class="font-medium">' + t.category + '</div>' +
            '<div class="text-xs text-gray-500">' + (t.memo || '') + '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2">' +
            '<div class="font-bold ' + (t.type === 'income' ? 'text-green-600' : 'text-red-600') + '">' +
              (t.type === 'income' ? '+' : '-') + formatNumber(t.amount) + '원' +
            '</div>' +

    function openAddTransactionWithDate(dateStr) {
      state.showAddTransaction = true;
      render();
