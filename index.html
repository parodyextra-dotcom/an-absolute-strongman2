      var config = categoryConfig[cat];
      
      // 상단 탭 메뉴
      var tabsHtml = Object.keys(categoryConfig).map(function(key) {
        var c = categoryConfig[key];
        var isActive = cat === key;
        var count = key === 'memo' ? state.memoItems.length : (key === 'todo' ? state.todoItems.length : state.scheduleItems.length);
        return '<button onclick="state.memoActiveCategory=\'' + key + '\';state.memoEditingId=null;render()" class="flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-xl transition-all ' + (isActive ? 'bg-white shadow-lg transform scale-105' : 'hover:bg-white hover:bg-opacity-50') + '">' +
          '<span class="text-2xl">' + c.icon + '</span>' +
          '<span class="text-xs font-bold ' + (isActive ? c.textColor : 'text-gray-600') + '">' + c.label + '</span>' +
          '<span class="text-xs px-2 py-0.5 rounded-full ' + (isActive ? 'bg-gradient-to-r ' + c.gradient + ' text-white' : 'bg-gray-200 text-gray-600') + '">' + count + '</span>' +
        '</button>';
      }).join('');
      
      // 검색바
      var searchBarHtml = '<div class="relative">' +
        '<input type="text" id="memoSearchInput" value="' + searchKeyword + '" placeholder="검색어를 입력하세요..." class="w-full pl-10 pr-10 py-3 rounded-xl border-2 border-gray-200 focus:border-violet-400 focus:outline-none transition text-sm" onkeyup="state.memoSearchKeyword=this.value;render()">' +
        '<i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>' +
        (searchKeyword ? '<button onclick="state.memoSearchKeyword=\'\';render()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>' : '') +
      '</div>';
      
      // 컨텐츠 렌더링
      var contentHtml = '';
      if (cat === 'memo') {
        contentHtml = renderMemoList(searchKeyword);
      } else if (cat === 'todo') {
        contentHtml = renderTodoList(searchKeyword);
      } else if (cat === 'schedule') {
        contentHtml = renderScheduleList(searchKeyword);
      }
      
      return '<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="padding: 0; margin: 0;" onclick="if(event.target===this){state.showMemoModal=false;state.memoEditingId=null;render();}">' +
        '<div class="bg-gradient-to-br from-gray-50 to-gray-100 w-full h-full max-w-full max-h-full overflow-hidden shadow-2xl flex flex-col" style="border-radius: 0;">' +
          // 헤더
          '<div class="bg-gradient-to-r ' + config.gradient + ' p-4 flex-shrink-0">' +
            '<div class="flex justify-between items-center mb-4">' +
              '<div class="flex items-center gap-3">' +
                '<div class="bg-white bg-opacity-20 p-2.5 rounded-xl"><span class="text-2xl">' + config.icon + '</span></div>' +
                '<div>' +
                  '<h2 class="text-xl font-bold text-white">절대강자 메모장</h2>' +
                  '<p class="text-white text-opacity-80 text-xs">모든 기록을 한 곳에서 간편하게</p>' +
                '</div>' +
              '</div>' +
              '<button onclick="state.showMemoModal=false;state.memoEditingId=null;render()" class="text-white text-2xl hover:bg-white hover:bg-opacity-20 rounded-full w-10 h-10 flex items-center justify-center transition">' +
                '<i data-lucide="x" class="w-6 h-6"></i>' +
              '</button>' +
            '</div>' +
            // 탭 메뉴
            '<div class="bg-white bg-opacity-20 rounded-2xl p-2 flex gap-2">' +
              tabsHtml +
            '</div>' +
          '</div>' +
          // 검색 및 컨텐츠
          '<div class="flex-1 overflow-y-auto p-4 space-y-4">' +
            searchBarHtml +
            contentHtml +
          '</div>' +
          // 하단 추가 버튼
          '<div class="flex-shrink-0 p-4 bg-white border-t shadow-lg">' +
            '<button onclick="openMemoAddForm(\'' + cat + '\')" class="w-full py-4 bg-gradient-to-r ' + config.btnBg + ' text-white rounded-2xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition">' +
              '<i data-lucide="plus" class="w-6 h-6"></i>' +
              '<span>' + config.label + ' 추가하기</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    
    // 일반 메모 목록 렌더링
    function renderMemoList(keyword) {
      var items = state.memoItems || [];
      if (keyword) {
        items = items.filter(function(m) {
          return (m.title && m.title.toLowerCase().includes(keyword.toLowerCase())) || 
                 (m.content && m.content.toLowerCase().includes(keyword.toLowerCase()));
        });
      }
      items = items.slice().sort(function(a, b) { return new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt); });
      
      if (items.length === 0) {
        return '<div class="text-center py-16">' +
          '<div class="text-6xl mb-4 opacity-50">📝</div>' +
          '<p class="text-gray-500 text-lg font-medium">메모가 없습니다</p>' +
          '<p class="text-gray-400 text-sm mt-1">새로운 메모를 추가해보세요</p>' +
        '</div>';
      }
      
      return '<div class="space-y-3">' +
        items.map(function(m) {
          var dateStr = formatMemoDate(m.updatedAt || m.createdAt);
          var colors = getMemoColor(m.color || 'purple');
          return '<div class="bg-white rounded-2xl p-4 shadow-md hover:shadow-lg transition-all border-l-4 ' + colors.border + '" onclick="viewMemoDetail(\'' + m.id + '\')">' +
            '<div class="flex justify-between items-start mb-2">' +
              '<h3 class="font-bold text-gray-800 text-lg flex-1 pr-2">' + escapeHtml(m.title || '제목 없음') + '</h3>' +
              '<div class="flex gap-1">' +
                '<button onclick="event.stopPropagation();editMemo(\'' + m.id + '\')" class="w-8 h-8 rounded-lg bg-violet-100 text-violet-600 flex items-center justify-center hover:bg-violet-200 transition">' +
                  '<i data-lucide="edit-2" class="w-4 h-4"></i>' +
                '</button>' +
                '<button onclick="event.stopPropagation();deleteMemo(\'' + m.id + '\')" class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200 transition">' +
                  '<i data-lucide="trash-2" class="w-4 h-4"></i>' +
                '</button>' +
              '</div>' +
            '</div>' +
            '<p class="text-gray-600 text-sm line-clamp-2 mb-3">' + escapeHtml(m.content || '').substring(0, 100) + (m.content && m.content.length > 100 ? '...' : '') + '</p>' +
            '<div class="flex items-center gap-2 text-xs text-gray-400">' +
              '<i data-lucide="clock" class="w-3 h-3"></i>' +
              '<span>' + dateStr + '</span>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }
    
    // 할일 목록 렌더링
    function renderTodoList(keyword) {
      var items = state.todoItems || [];
      if (keyword) {
        items = items.filter(function(t) {
          return t.title && t.title.toLowerCase().includes(keyword.toLowerCase());
        });
      }
      
      var pendingItems = items.filter(function(t) { return !t.completed; });
      var completedItems = items.filter(function(t) { return t.completed; });
      
      if (items.length === 0) {
        return '<div class="text-center py-16">' +
          '<div class="text-6xl mb-4 opacity-50">✅</div>' +
          '<p class="text-gray-500 text-lg font-medium">할일이 없습니다</p>' +
          '<p class="text-gray-400 text-sm mt-1">새로운 할일을 추가해보세요</p>' +
        '</div>';
      }
      
      var html = '';
      
      // 진행중인 할일
      if (pendingItems.length > 0) {
        html += '<div class="mb-4">' +
          '<div class="flex items-center gap-2 mb-3">' +
            '<span class="bg-pink-500 text-white text-xs font-bold px-3 py-1 rounded-full">진행중 ' + pendingItems.length + '</span>' +
          '</div>' +
          '<div class="space-y-2">' +
            pendingItems.map(function(t) {
              var priorityColor = t.priority === 'high' ? 'bg-red-500' : (t.priority === 'medium' ? 'bg-yellow-500' : 'bg-green-500');
              return '<div class="bg-white rounded-xl p-4 shadow-md flex items-center gap-3 border-l-4 border-pink-400">' +
                '<button onclick="toggleTodoComplete(\'' + t.id + '\')" class="w-7 h-7 rounded-full border-2 border-pink-400 flex items-center justify-center hover:bg-pink-100 transition flex-shrink-0">' +
                '</button>' +
                '<div class="flex-1 min-w-0">' +
                  '<p class="font-semibold text-gray-800 truncate">' + escapeHtml(t.title) + '</p>' +
                  (t.dueDate ? '<p class="text-xs text-gray-400 mt-1"><i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i>' + t.dueDate + '</p>' : '') +
                '</div>' +
                '<div class="w-2.5 h-2.5 rounded-full ' + priorityColor + ' flex-shrink-0"></div>' +
                '<button onclick="deleteTodo(\'' + t.id + '\')" class="w-8 h-8 rounded-lg text-gray-400 hover:bg-red-100 hover:text-red-500 flex items-center justify-center transition flex-shrink-0">' +
                  '<i data-lucide="trash-2" class="w-4 h-4"></i>' +
                '</button>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }
      
      // 완료된 할일
      if (completedItems.length > 0) {
        html += '<div>' +
          '<div class="flex items-center gap-2 mb-3">' +
            '<span class="bg-gray-400 text-white text-xs font-bold px-3 py-1 rounded-full">완료 ' + completedItems.length + '</span>' +
          '</div>' +
          '<div class="space-y-2">' +
            completedItems.map(function(t) {
              return '<div class="bg-gray-100 rounded-xl p-4 shadow flex items-center gap-3 opacity-70">' +
                '<button onclick="toggleTodoComplete(\'' + t.id + '\')" class="w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center flex-shrink-0">' +
                  '<i data-lucide="check" class="w-4 h-4"></i>' +
                '</button>' +
                '<div class="flex-1 min-w-0">' +
                  '<p class="font-medium text-gray-500 line-through truncate">' + escapeHtml(t.title) + '</p>' +
                '</div>' +
                '<button onclick="deleteTodo(\'' + t.id + '\')" class="w-8 h-8 rounded-lg text-gray-400 hover:bg-red-100 hover:text-red-500 flex items-center justify-center transition flex-shrink-0">' +
                  '<i data-lucide="trash-2" class="w-4 h-4"></i>' +
                '</button>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }
      
      return html;
    }
    
    // 일정 목록 렌더링
    function renderScheduleList(keyword) {
      var items = state.scheduleItems || [];
      if (keyword) {
        items = items.filter(function(s) {
          return (s.title && s.title.toLowerCase().includes(keyword.toLowerCase())) ||
                 (s.location && s.location.toLowerCase().includes(keyword.toLowerCase()));
        });
      }
      items = items.slice().sort(function(a, b) { 
        return new Date(a.date + ' ' + (a.time || '00:00')) - new Date(b.date + ' ' + (b.time || '00:00')); 
      });
      
      if (items.length === 0) {
        return '<div class="text-center py-16">' +
          '<div class="text-6xl mb-4 opacity-50">📅</div>' +
          '<p class="text-gray-500 text-lg font-medium">일정이 없습니다</p>' +
          '<p class="text-gray-400 text-sm mt-1">새로운 일정을 추가해보세요</p>' +
        '</div>';
      }
      
      // 날짜별 그룹화
      var grouped = {};
      items.forEach(function(s) {
        var date = s.date || '날짜 미정';
        if (!grouped[date]) grouped[date] = [];
        grouped[date].push(s);
      });
      
      var today = new Date().toISOString().split('T')[0];
      
      return Object.keys(grouped).sort().map(function(date) {
        var isToday = date === today;
        var isPast = date < today;
        var dateLabel = formatScheduleDate(date);
        
        return '<div class="mb-4">' +
          '<div class="flex items-center gap-2 mb-3">' +
            '<span class="' + (isToday ? 'bg-sky-500 text-white' : (isPast ? 'bg-gray-400 text-white' : 'bg-sky-100 text-sky-700')) + ' text-xs font-bold px-3 py-1.5 rounded-full">' + 
              (isToday ? '오늘' : dateLabel) +
            '</span>' +
          '</div>' +
          '<div class="space-y-2">' +
            grouped[date].map(function(s) {
              return '<div class="bg-white rounded-xl p-4 shadow-md border-l-4 ' + (s.important ? 'border-red-400' : 'border-sky-400') + ' ' + (isPast ? 'opacity-60' : '') + '">' +
                '<div class="flex justify-between items-start">' +
                  '<div class="flex-1">' +
                    '<div class="flex items-center gap-2 mb-1">' +
                      (s.important ? '<span class="text-red-500 text-sm">⭐</span>' : '') +
                      '<h4 class="font-bold text-gray-800">' + escapeHtml(s.title) + '</h4>' +
                    '</div>' +
                    '<div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">' +
                      (s.time ? '<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>' + s.time + '</span>' : '') +
                      (s.location ? '<span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>' + escapeHtml(s.location) + '</span>' : '') +
                    '</div>' +
                    (s.memo ? '<p class="text-gray-500 text-sm mt-2">' + escapeHtml(s.memo) + '</p>' : '') +
                  '</div>' +
                  '<div class="flex gap-1">' +
                    '<button onclick="editSchedule(\'' + s.id + '\')" class="w-8 h-8 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center hover:bg-sky-200 transition">' +
                      '<i data-lucide="edit-2" class="w-4 h-4"></i>' +
                    '</button>' +
                    '<button onclick="deleteSchedule(\'' + s.id + '\')" class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200 transition">' +
                      '<i data-lucide="trash-2" class="w-4 h-4"></i>' +
                    '</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');
    }
    
    // 메모 색상 반환
    function getMemoColor(color) {
      var colors = {
        purple: { bg: 'bg-violet-100', border: 'border-violet-400', text: 'text-violet-600' },
        pink: { bg: 'bg-pink-100', border: 'border-pink-400', text: 'text-pink-600' },
        blue: { bg: 'bg-blue-100', border: 'border-blue-400', text: 'text-blue-600' },
        green: { bg: 'bg-green-100', border: 'border-green-400', text: 'text-green-600' },
        yellow: { bg: 'bg-yellow-100', border: 'border-yellow-400', text: 'text-yellow-600' },
        orange: { bg: 'bg-orange-100', border: 'border-orange-400', text: 'text-orange-600' }
      };
      return colors[color] || colors.purple;
    }
    
    // 메모 날짜 포맷
    function formatMemoDate(dateStr) {
      if (!dateStr) return '';
      var date = new Date(dateStr);
      var now = new Date();
      var diff = now - date;
      var minutes = Math.floor(diff / 60000);
      var hours = Math.floor(diff / 3600000);
      var days = Math.floor(diff / 86400000);
      
      if (minutes < 1) return '방금 전';
      if (minutes < 60) return minutes + '분 전';
      if (hours < 24) return hours + '시간 전';
      if (days < 7) return days + '일 전';
      
      var month = date.getMonth() + 1;
      var day = date.getDate();
      return month + '월 ' + day + '일';
    }
    
    // 일정 날짜 포맷
    function formatScheduleDate(dateStr) {
      if (!dateStr || dateStr === '날짜 미정') return dateStr;
      var date = new Date(dateStr);
      var days = ['일', '월', '화', '수', '목', '금', '토'];
      var month = date.getMonth() + 1;
      var day = date.getDate();
      var dayName = days[date.getDay()];
      return month + '월 ' + day + '일 (' + dayName + ')';
    }
    
    // HTML 이스케이프
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    
    // 메모 추가 폼 열기
    function openMemoAddForm(category) {
      state.memoEditingId = null;
      var html = '';
      
      if (category === 'memo') {
        html = renderMemoFormModal('새 메모 작성', '', '', 'purple', false);
      } else if (category === 'todo') {
        html = renderTodoFormModal('새 할일 추가', '', '', 'medium', false);
      } else if (category === 'schedule') {
        html = renderScheduleFormModal('새 일정 추가', '', new Date().toISOString().split('T')[0], '', '', '', false, false);
      }
      
      document.getElementById('memo-form-container').innerHTML = html;
      document.getElementById('memo-form-container').style.display = 'flex';
      setTimeout(function() { lucide.createIcons(); }, 50);
    }
    
    // 메모 입력 폼 모달
    function renderMemoFormModal(title, memoTitle, memoContent, memoColor, isEdit) {

        }[c];
        return '<button type="button" onclick="selectMemoColor(\'' + c + '\')" class="w-10 h-10 rounded-full ' + colorClass + ' ' + (memoColor === c ? 'ring-4 ring-offset-2 ring-gray-400' : '') + ' transition-all hover:scale-110" data-color="' + c + '"></button>';
      }).join('');
      
      return '<div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[60] p-4" onclick="if(event.target===this)closeMemoForm()">' +
        '<div class="bg-white rounded-3xl w-full max-w-md max-h-[90vh] overflow-hidden shadow-2xl">' +
          '<div class="bg-gradient-to-r from-violet-500 to-purple-600 p-4">' +
            '<div class="flex justify-between items-center">' +
              '<h3 class="text-white font-bold text-lg">' + title + '</h3>' +
              '<button onclick="closeMemoForm()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-8 h-8 flex items-center justify-center transition">' +
                '<i data-lucide="x" class="w-5 h-5"></i>' +
              '</button>' +
            '</div>' +
          '</div>' +

            '<div>' +
              '<label class="block text-sm font-semibold text-gray-700 mb-2">제목</label>' +
              '<input type="text" id="memoFormTitle" value="' + escapeHtml(memoTitle) + '" placeholder="메모 제목을 입력하세요" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-violet-400 focus:outline-none transition text-base">' +
            '</div>' +
            '<div>' +
              '<label class="block text-sm font-semibold text-gray-700 mb-2">내용 *</label>' +

            '</div>' +

              '<label class="block text-sm font-semibold text-gray-700 mb-2">색상</label>' +

    // 할일 입력 폼 모달
    function renderTodoFormModal(title, todoTitle, todoDueDate, todoPriority, isEdit) {
      var priorities = [
        { value: 'low', label: '낮음', color: 'bg-green-500' },
        { value: 'medium', label: '보통', color: 'bg-yellow-500' },
        { value: 'high', label: '높음', color: 'bg-red-500' }

      var priorityOptions = priorities.map(function(p) {
        return '<button type="button" onclick="selectTodoPriority(\'' + p.value + '\')" class="flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition ' + (todoPriority === p.value ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200') + '" data-priority="' + p.value + '">' +
          '<span class="w-3 h-3 rounded-full ' + p.color + '"></span>' +
          '<span class="font-medium">' + p.label + '</span>' +
        '</button>';
      }).join('');
      
      return '<div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[60] p-4" onclick="if(event.target===this)closeMemoForm()">' +
        '<div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">' +
          '<div class="bg-gradient-to-r from-pink-500 to-rose-600 p-4">' +
            '<div class="flex justify-between items-center">' +
              '<h3 class="text-white font-bold text-lg">' + title + '</h3>' +
              '<button onclick="closeMemoForm()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-8 h-8 flex items-center justify-center transition">' +
                '<i data-lucide="x" class="w-5 h-5"></i>' +
              '</button>' +

    function calculateCompound() {
      var initial = getAmountValue('calcInitial');
      var monthly = getAmountValue('calcMonthly');
      var years = Number(document.getElementById('calcYears').value) || 0;
      var rate = Number(document.getElementById('calcRate').value) / 100 || 0;

      if (years === 0) { alert('투자 기간을 입력해주세요'); return; }
      if (initial === 0 && monthly === 0) { alert('초기 투자금 또는 월 적립금을 입력해주세요'); return; }

      // 연도별 데이터 계산
      var yearlyData = [];
      var currentAmount = initial;
      var totalDeposit = initial;
      
      // 0년차 (초기)
      yearlyData.push({
        year: 0,
        totalAmount: initial,
        deposit: initial,
        interest: 0,
        yearlyInterest: 0
      });

      for (var year = 1; year <= years; year++) {
        var yearStartAmount = currentAmount;
        for (var month = 1; month <= 12; month++) {
          currentAmount += monthly;
          currentAmount = currentAmount * (1 + rate / 12);
        }
        totalDeposit += monthly * 12;
        var totalInterest = currentAmount - totalDeposit;
        var yearlyInterest = currentAmount - yearStartAmount - (monthly * 12);
        
        yearlyData.push({
          year: year,
          totalAmount: Math.round(currentAmount),
          deposit: totalDeposit,
          interest: Math.round(totalInterest),
          yearlyInterest: Math.round(yearlyInterest)
        });
      }

      var finalAmount = Math.round(currentAmount);
      var finalDeposit = totalDeposit;
      var totalInterest = finalAmount - finalDeposit;
      var profitRate = finalDeposit > 0 ? ((totalInterest / finalDeposit) * 100).toFixed(1) : 0;
      var maxAmount = finalAmount;

      // 그래프 바 생성
      var chartBarsHtml = yearlyData.map(function(d, idx) {
        var depositHeight = maxAmount > 0 ? (d.deposit / maxAmount * 100) : 0;
        var interestHeight = maxAmount > 0 ? (d.interest / maxAmount * 100) : 0;
        var totalHeight = depositHeight + interestHeight;
        var isLast = idx === yearlyData.length - 1;
        
        return '<div class="flex flex-col items-center flex-1 min-w-[30px]">' +
          '<div class="h-32 w-full flex flex-col justify-end items-center relative">' +
            '<div class="w-full max-w-[24px] rounded-t-md overflow-hidden flex flex-col justify-end" style="height: ' + totalHeight + '%">' +
              (d.interest > 0 ? '<div class="bg-gradient-to-t from-green-400 to-emerald-400 w-full" style="height: ' + (interestHeight / (totalHeight || 1) * 100) + '%"></div>' : '') +
              '<div class="bg-gradient-to-t from-indigo-500 to-purple-500 w-full" style="height: ' + (depositHeight / (totalHeight || 1) * 100) + '%"></div>' +
            '</div>' +
            (isLast ? '<div class="absolute -top-6 text-xs font-bold text-purple-600">' + (d.totalAmount / 10000).toFixed(0) + '만</div>' : '') +
          '</div>' +
          '<div class="text-xs text-gray-500 mt-1 font-medium">' + d.year + '년</div>' +
        '</div>';
      }).join('');

      // 연도별 상세 테이블 (전체 펼침)
      var yearlyTableHtml = '<div class="overflow-x-auto">' +
        '<table class="w-full text-sm">' +
          '<thead class="bg-indigo-100">' +
            '<tr>' +
              '<th class="py-2.5 px-2 text-left text-indigo-800 font-bold">년차</th>' +
              '<th class="py-2.5 px-2 text-right text-indigo-800 font-bold">총 금액</th>' +
              '<th class="py-2.5 px-2 text-right text-indigo-800 font-bold">납입금</th>' +
              '<th class="py-2.5 px-2 text-right text-indigo-800 font-bold">누적 이자</th>' +
              '<th class="py-2.5 px-2 text-right text-indigo-800 font-bold">연 이자</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            yearlyData.slice(1).map(function(d, idx) {
              var isEven = idx % 2 === 0;
              var isMilestone = d.year % 5 === 0;
              return '<tr class="' + (isMilestone ? 'bg-purple-50 border-l-4 border-purple-400' : (isEven ? 'bg-white' : 'bg-gray-50')) + ' border-b border-gray-200">' +

    var currentCatType = 'expense';

    function setCatType(type) {
      currentCatType = type;
      var expBtn = document.getElementById('cat-expense-btn');
      var incBtn = document.getElementById('cat-income-btn');
      if (expBtn) expBtn.className = type === 'expense' ? 'flex-1 py-2 rounded-lg bg-red-500 text-white' : 'flex-1 py-2 rounded-lg bg-gray-200';
      if (incBtn) incBtn.className = type === 'income' ? 'flex-1 py-2 rounded-lg bg-green-500 text-white' : 'flex-1 py-2 rounded-lg bg-gray-200';
      updateCategoryList();
    }

    function updateCategoryList() {
      var listEl = document.getElementById('category-list');
      if (!listEl) return;
      listEl.innerHTML = state.categories[currentCatType].map(function(c, i) {
        return '<div class="flex justify-between items-center p-2 border rounded bg-gray-50">' +
          '<span>' + c + '</span>' +
          '<button onclick="deleteCategory(\'' + currentCatType + '\',' + i + ')" class="text-red-500 text-sm px-2">삭제</button>' +
        '</div>';
      }).join('');
    }

    function addCategory() {
      var nameEl = document.getElementById('newCatName');
      var name = nameEl ? nameEl.value.trim() : '';
      if (!name) { alert('카테고리 이름을 입력해주세요'); return; }
      state.categories[currentCatType].push(name);
      saveData();
      nameEl.value = '';
      updateCategoryList();
      showToast('카테고리가 추가되었습니다');
    }

    function deleteCategory(type, index) {
      if (confirm('삭제하시겠습니까?')) {
        state.categories[type].splice(index, 1);
        saveData();
        updateCategoryList();
        showToast('카테고리가 삭제되었습니다');
      }
    }

    function resetAllData() {
      // If in Flutter WebView, delegate confirmation to Flutter
      if (FlutterBridge.isFlutterWebView()) {
        FlutterBridge.confirmClearData();
        showToast('데이터 삭제 확인을 요청했습니다');
        return;
      }
      
      // Browser fallback with confirm dialogs
      if (confirm('정말 모든 데이터를 삭제하시겠습니까?') && confirm('다시 한번 확인합니다.')) {
        performResetAllData();
      }
    }
    
    // Actual data reset function (can be called from Flutter)
    function performResetAllData() {
      state.transactions = [];
      state.memos = [];
      state.events = [];
      state.bankBalances = [];
      state.investments = [];
      state.dividends = [];
      state.investmentJournals = [];
      state.loans = [];
      state.fixedExpenses = [];
      state.goals = { year7: '', year5: '', year3: '', thisYear: '' };
      state.undoStack = [];
      state.usdPhases = [];
      state.jpyPhases = [];
      state.usdNextId = 1;
      state.jpyNextId = 1;
      saveData();
      state.showSettings = false;
      render();
      showToast('모든 데이터가 삭제되었습니다');
      FlutterBridge.notifyDataChange('clearAll');
    }
    
    // Expose to window for Flutter access
    window.performResetAllData = performResetAllData;

    // 구글 로그인 클라이언트 ID
    var GOOGLE_CLIENT_ID = '747664520211-pp2ecpul65tf8jo3dtvmljs2teba75ag.apps.googleusercontent.com';
    var googleClient = null;
    
    // 구글 로그인 초기화
    function initGoogleLogin() {
      if (typeof google !== 'undefined' && google.accounts) {
        googleClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile',
          callback: handleGoogleCredentialResponse
        });
      } else {
        // 스크립트 로드 대기
        setTimeout(initGoogleLogin, 500);
      }
    }
    
    // 구글 로그인 응답 처리
    function handleGoogleCredentialResponse(tokenResponse) {
      if (tokenResponse && tokenResponse.access_token) {
        // 사용자 정보 가져오기
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: {
            'Authorization': 'Bearer ' + tokenResponse.access_token
          }
        })
        .then(function(response) { return response.json(); })
        .then(function(userInfo) {
          state.googleUser = {
            id: userInfo.sub,
            name: userInfo.name,
            email: userInfo.email,
            picture: userInfo.picture
          };
          // 로컬 스토리지에 저장
          storage.set('googleUser', state.googleUser);
          saveData();
          render();
          showToast('Google 계정으로 로그인되었습니다');
        })
        .catch(function(error) {
          console.error('Google user info fetch error:', error);
          showToast('사용자 정보를 가져오는데 실패했습니다');
        });
      }
    }
    
    // 구글 로그인 (Flutter WebView에서 호출 또는 웹에서 Google OAuth)
    function googleLogin() {
      if (FlutterBridge.isFlutterWebView()) {
        FlutterBridge.postMessage('googleLogin', {});
        showToast('구글 로그인을 요청했습니다');
      } else {
        // 웹에서 Google Identity Services 사용
        if (googleClient) {
          googleClient.requestAccessToken();
        } else {
          showToast('Google 로그인을 초기화 중입니다. 잠시 후 다시 시도해주세요.');
          initGoogleLogin();
        }
      }
    }
    
    // 구글 로그아웃
    function googleLogout() {
      state.googleUser = null;
      storage.remove('googleUser');
      saveData();
      
      // 프로필 모달이 열려있으면 닫았다가 다시 열어서 UI 갱신
      if (state.showProfile) {
        state.showProfile = false;
        render();
        setTimeout(function() {
          state.showProfile = true;
          render();
          showToast('로그아웃되었습니다');
        }, 100);
      } else {
        render();
        showToast('로그아웃되었습니다');
      }
      
      // Google 토큰 해제 (선택적)
      if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
        google.accounts.oauth2.revoke(storage.get('googleAccessToken'), function() {
          console.log('Google token revoked');
        });
      }
    }

    // Update date/time display function
    function updateDateTime() {
      var dateTimeEl = document.getElementById('current-datetime');
      if (!dateTimeEl) return;
      
      var now = new Date();
      var dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var day = String(now.getDate()).padStart(2, '0');
      var dayName = dayNames[now.getDay()];
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      var seconds = String(now.getSeconds()).padStart(2, '0');
      
      dateTimeEl.textContent = year + '년 ' + month + '월 ' + day + '일 ' + dayName + ' ' + hours + ':' + minutes + ':' + seconds;
    }

    // Start clock update interval
    setInterval(updateDateTime, 1000);

    // Swipe navigation
    var tabOrder = ['home', 'history', 'stats', 'goal', 'invest', 'exchange'];
    var touchStartX = 0;
    var touchStartY = 0;
    var touchEndX = 0;
    var touchEndY = 0;
    var minSwipeDistance = 50;
    var swipeDirection = null;

    function handleSwipe() {
      var diffX = touchStartX - touchEndX;
      var diffY = touchStartY - touchEndY;
      
      // 수평 스와이프가 수직보다 클 때만 처리 (스크롤과 구분)
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > minSwipeDistance) {
        var currentIndex = tabOrder.indexOf(state.activeTab);
        if (currentIndex === -1) return;
        
        if (diffX > 0) {
          // 왼쪽으로 스와이프 → 다음 탭
          var nextIndex = (currentIndex + 1) % tabOrder.length;
          swipeDirection = 'left';
          setActiveTab(tabOrder[nextIndex]);
        } else {
          // 오른쪽으로 스와이프 → 이전 탭
          var prevIndex = (currentIndex - 1 + tabOrder.length) % tabOrder.length;
          swipeDirection = 'right';
          setActiveTab(tabOrder[prevIndex]);
        }
      }
    }

    document.addEventListener('touchstart', function(e) {
      // 모달이 열려있으면 스와이프 무시
      if (state.showAddTransaction || state.showCompoundCalc || state.showSettings || 
          state.showAddInvestment || state.showAddDividend || state.showAddJournal || 
          state.showRankInfo || state.showIframeModal || state.showSideMenu) return;
      
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      // 모달이 열려있으면 스와이프 무시
      if (state.showAddTransaction || state.showCompoundCalc || state.showSettings || 
          state.showAddInvestment || state.showAddDividend || state.showAddJournal || 
          state.showRankInfo || state.showIframeModal || state.showSideMenu) return;
      
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    // Main render function
    function render() {
      var app = document.getElementById('app');
      
      if (state.isLoading) {
        app.innerHTML = '<div class="flex items-center justify-center min-h-screen">' +
          '<div class="text-center">' +
            '<div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>' +
            '<div class="text-gray-600">데이터 로딩 중...</div>' +
          '</div>' +
        '</div>';
        return;
      }

      var content = '';
      if (state.activeTab === 'home') content = renderHomeScreen();
      else if (state.activeTab === 'history') content = renderHistoryScreen();
      else if (state.activeTab === 'stats') content = renderStatsScreen();
      else if (state.activeTab === 'goal') content = renderGoalScreen();
      else if (state.activeTab === 'invest') content = renderInvestmentScreen();
      else if (state.activeTab === 'exchange') content = renderExchangeScreen();

      var modals = '';
      if (state.showAddTransaction) modals += renderAddTransactionModal();
      if (state.showCompoundCalc) modals += renderCompoundCalc();
      if (state.showSettings) modals += renderSettings();
      if (state.showAddInvestment) modals += renderAddInvestmentModal();
      if (state.showAddDividend) modals += renderAddDividendModal();
      if (state.showAddJournal) modals += renderAddJournalModal();
      if (state.showRankInfo) modals += renderRankInfoModal();
      if (state.showIncomeDetail) modals += renderIncomeDetailModal();
      if (state.showExpenseDetail) modals += renderExpenseDetailModal();
      if (state.showMonthlyBalance) modals += renderMonthlyBalanceModal();
      if (state.showUnnecessaryDetail) modals += renderUnnecessaryDetailModal();
      if (state.showIframeModal) modals += renderIframeModal();
      if (state.showMemoModal) modals += renderMemoModal();
      if (state.showSideMenu) modals += renderSideMenu();
      if (state.showProfile) modals += renderProfileModal();
      if (state.showRatingModal) modals += renderRatingModal();

      var animClass = '';
      if (swipeDirection === 'left') animClass = ' animate-slide-left';
      else if (swipeDirection === 'right') animClass = ' animate-slide-right';
      swipeDirection = null;

      app.innerHTML = renderHeader() + '<div class="pb-4' + animClass + '">' + content + '</div>' + renderNavbar() + modals;

      lucide.createIcons();

      // Update current date/time display
      updateDateTime();

      // Post-render updates
      setTimeout(function() {
        if (state.activeTab === 'history') {
          updateHistoryList();
          var startDate = document.getElementById('startDate');
          var endDate = document.getElementById('endDate');
          var searchKeyword = document.getElementById('searchKeyword');
          if (startDate) startDate.addEventListener('change', updateHistoryList);
          if (endDate) endDate.addEventListener('change', updateHistoryList);
          if (searchKeyword) searchKeyword.addEventListener('input', updateHistoryList);
        }
        if (state.activeTab === 'stats') updateStatsContent();
      }, 0);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      loadData();
    });
  </script>
</body>
</html>
